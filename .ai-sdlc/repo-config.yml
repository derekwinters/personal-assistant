capabilities:
  - hygiene
  - consistency
  - labels
  - release
  - pipeline

profiles:
  - kotlin

owners:
  - derekwinters

dashboard_issue: 1

commands:
  test: ./gradlew test

fire:
  endpoint_secret: ROUTINE_FIRE_URL
  token_secret: ROUTINE_FIRE_TOKEN

# Which ai-sdlc skills this repository installs. `skills-update` opens a
# pull request when one of them changes upstream, and a name removed here
# is uninstalled on the next run.
#
# Seeded once by `adopt` from the capabilities above, and never touched
# again: this list is yours. Add to it, prune it, or set it to `[]` to
# install none — whatever is here is what a later adoption will honour.
skills:
  - github-api
  - release-flow
  - triage-issue
  - pipeline-dev
  - issue-blockers
  - ci-watch
  - milestone-ops
  - routines

# The Claude Code routines this repository wants, by definition id. The
# `routines` skill renders them for this repository and an agent in a cloud
# session creates or updates them to match. Yours, like `skills:` — `adopt`
# never writes it. `triage` needs the pipeline and an API trigger whose URL
# and token go in the secrets `fire:` names above.
routines:
  - triage
  - dependabot
